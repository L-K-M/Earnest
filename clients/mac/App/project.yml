name: Earnest
options:
  deploymentTarget:
    macOS: '26.0'
packages:
  EarnestKit:
    path: ../EarnestKit
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.8.0
targets:
  Earnest:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: EarnestKit
      - package: GRDB
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.Earnest
        PRODUCT_NAME: Earnest
        # Development placeholders; package-client.sh stamps the source tag.
        MARKETING_VERSION: '0.0.0'
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: '5.0'
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Earnest.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleURLTypes: ''
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Connect to the Earnest server you configure on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ch.lkmc.Earnest.entry
            CFBundleURLSchemes: [earnest]
          - CFBundleURLName: ch.lkmc.Earnest.feed
            CFBundleURLSchemes: [feed]
        # OPML subscription lists open as an import, ranked below a reader
        # the user has chosen as their default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: OPML Subscription List
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.opml.opml]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML Subscription List
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [opml]
              public.mime-type: [text/x-opml]
  EarnestTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Earnest
schemes:
  Earnest:
    build:
      targets:
        Earnest: all
        EarnestTests: [test]
    test:
      commandLineArguments:
        '-server ""': true
      targets: [EarnestTests]
