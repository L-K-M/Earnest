name: Android

on:
  workflow_call:
  pull_request:
    paths:
      - 'clients/android/**'
      - 'testdata/vectors/**'
      - 'api/openapi.json'
      - 'scripts/android-release-test.sh'
      - 'scripts/package-client.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools  # the default 'tools' no longer exists
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
      - name: Test, assemble and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug lint
      - name: Verify release signing with a disposable test key
        run: bash ../../scripts/android-release-test.sh
