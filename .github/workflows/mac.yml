name: Mac

on:
  workflow_call:
  pull_request:
    paths:
      - 'clients/mac/**'
      - 'testdata/vectors/**'
      - 'api/openapi.json'
      - 'scripts/package-client.sh'
      - '.github/workflows/mac.yml'

permissions:
  contents: read

concurrency:
  group: mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    container: swift:6.3.3
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/mac/EarnestKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build -j 2
      - run: swift test -j 2

  app:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/mac/App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package tests on macOS
        # Darwin's Foundation differs from Linux's; the app ships on Darwin.
        working-directory: clients/mac/EarnestKit
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild build test -project Earnest.xcodeproj -scheme Earnest -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -jobs 2
      - name: Check universal archive layout without distribution signing
        run: |
          xcodebuild archive -project Earnest.xcodeproj -scheme Earnest -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Earnest.xcarchive" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO MARKETING_VERSION=0.0.0 \
            CURRENT_PROJECT_VERSION=1 CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -jobs 2
          app="$RUNNER_TEMP/Earnest.xcarchive/Products/Applications/Earnest.app"
          architectures=" $(lipo -archs "$app/Contents/MacOS/Earnest") "
          [[ "$architectures" == *' arm64 '* && "$architectures" == *' x86_64 '* ]]
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = 0.0.0
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = 1
