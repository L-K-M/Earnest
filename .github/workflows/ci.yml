name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on PRs, never an in-progress main run: a permanently
# "cancelled" main commit masks breakage and breaks CI bisection.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Store and service tests run against the same Postgres the stack uses;
    # without EARNEST_TEST_DATABASE_URL they skip, so CI must provide it.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: earnest
          POSTGRES_PASSWORD: earnest
          POSTGRES_DB: earnest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U earnest" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      EARNEST_TEST_DATABASE_URL: postgres://earnest:earnest@localhost:5432/earnest_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: script tests
        run: |
          sh scripts/backup_test.sh
          python3 scripts/package_client_test.py
      - name: go build
        run: go build -trimpath -o dist/earnest ./cmd/earnest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json  # packageManager pins pnpm there
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-generated

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the compose stack
        # Required secrets get placeholders; only the file's shape is checked.
        env:
          EARNEST_DB_PASSWORD: ci-placeholder
          EARNEST_SECRET_KEY: ci-placeholder-ci-placeholder-ci-placeholder
        run: docker compose -f compose.yaml config --quiet
