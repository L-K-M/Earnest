# compose.yaml — Earnest stack
#   docker compose up -d --build     earnest + postgres (pgvector)
#   ./update.sh                      on a deployment: sync + rebuild + recreate
#
# The earnest image is built locally from this checkout, never pulled: private
# and self-hosted deployments can't rely on anonymous registry pulls.

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:

  postgres:
    <<: *service-defaults
    # Postgres + pgvector per docs/research/tech-stack.md: the `vector`
    # extension carries the embeddings and semantic-search pipeline once it
    # lands. The pg18 tag tracks the image's Postgres 18 line.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: earnest
      # "earnest" is a zero-config dev default — set EARNEST_DB_PASSWORD in
      # .env for any real deployment. The app reads the same variable below,
      # so the credential can't drift between the two services.
      POSTGRES_PASSWORD: ${EARNEST_DB_PASSWORD:-earnest}
      POSTGRES_DB: earnest
    ports:
      # Bound to loopback: the published port is for host tooling (psql,
      # migrations); earnest reaches Postgres over the compose network
      # regardless, so the database is never on the host's external
      # interfaces. Widen EARNEST_DB_BIND only if another host must connect.
      - "${EARNEST_DB_BIND:-127.0.0.1}:${EARNEST_DB_PORT:-5432}:5432"
    volumes:
      # Managed named volume by default. Set EARNEST_DB_VOLUME in .env to an
      # absolute host path (e.g. /srv/earnest/pgdata) to bind-mount instead —
      # it must be empty on first start so Postgres can initialise it.
      - ${EARNEST_DB_VOLUME:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnest"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    <<: *service-defaults
    image: pgvector/pgvector:pg18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: earnest
      PGDATABASE: earnest
      PGPASSWORD: ${EARNEST_DB_PASSWORD:-earnest}
      BACKUP_KEEP: ${EARNEST_BACKUP_KEEP:-14}
    volumes:
      - ${EARNEST_BACKUP_VOLUME:-backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sh /usr/local/bin/backup.sh || echo 'backup failed' >&2; sleep 86400; done"]

  earnest:
    <<: *service-defaults
    image: earnest:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Pass optional push and dynamically named LLM settings from the deployment file.
    env_file:
      - path: .env
        required: false
    environment:
      EARNEST_HTTP_ADDR: ":8080"
      EARNEST_CONTENT_ADDR: ":8081"
      # Override for an external database; otherwise use this stack's Postgres.
      EARNEST_DATABASE_URL: ${EARNEST_DATABASE_URL:-postgres://earnest:${EARNEST_DB_PASSWORD:-earnest}@postgres:5432/earnest}
      # Required for signing and encrypted stored credentials. Keep with backups.
      EARNEST_SECRET_KEY: ${EARNEST_SECRET_KEY:?Set EARNEST_SECRET_KEY to at least 32 bytes}
      # Provision the distinct content origin before enabling article frames.
      EARNEST_BASE_URL: "${EARNEST_BASE_URL:-http://localhost:8080}"
      EARNEST_CONTENT_ORIGIN: "${EARNEST_CONTENT_ORIGIN:-http://localhost:8081}"
      EARNEST_OUTBOUND_ALLOW_PRIVATE: "${EARNEST_OUTBOUND_ALLOW_PRIVATE:-}"
      # Proxies (beyond loopback) whose X-Forwarded-For names the client for
      # login rate limits; behind tailscale serve, the Docker network gateway.
      EARNEST_TRUSTED_PROXIES: "${EARNEST_TRUSTED_PROXIES:-}"
      EARNEST_FETCH_MIN_INTERVAL: "${EARNEST_FETCH_MIN_INTERVAL:-15m}"
      EARNEST_FETCH_MAX_INTERVAL: "${EARNEST_FETCH_MAX_INTERVAL:-24h}"
      EARNEST_RETENTION_DAYS: "${EARNEST_RETENTION_DAYS:-90}"
      EARNEST_LOG_LEVEL: "${EARNEST_LOG_LEVEL:-info}"
    ports:
      - "${EARNEST_PORT:-8080}:8080"
      - "${EARNEST_CONTENT_PORT:-8081}:8081"
    # The image ships no curl — the binary doubles as its own liveness probe.
    healthcheck:
      test: ["CMD", "/usr/local/bin/earnest", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Managed named volume — the default DB store. When EARNEST_DB_VOLUME names a
# host path, postgres bind-mounts instead and this goes unreferenced.
volumes:
  pgdata:
  backups:
